name: Hourly update & deploy

on:
  schedule:
    - cron: "5 * * * *"   # every hour, 5 past (UTC)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest scores, standings & headlines
        run: python scripts/fetch_data.py

      - name: Stamp asset URLs so browsers load the newest CSS/JS
        run: sed -i "s/__BUILD__/${GITHUB_RUN_ID}/g" site/*.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
